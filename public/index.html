        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will

        <title>Exygen Labs Mexico</title>
        <script>
          // Contraparte de public/404.html: reconstruye la URL real cuando el
          // visitante entro directo a una ruta interna (confirmar correo,
          // activar invitacion, restablecer contrasena, ficha de producto...).
          // Debe correr ANTES de que React monte el router.
          (function () {
            var l = window.location;
            if (l.search[1] !== '/') return;
            var decoded = l.search.slice(1).split('&').map(function (s) {
              return s.replace(/~and~/g, '&');
            }).join('?');
            window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
          })();
        </script>

        El sitio abre en oscuro (ThemeContext), pero la clase `dark` se la ponía
        React al montar — o sea después de descargar el JavaScript. Hasta ese
        momento el navegador pintaba el tema claro (marfil) y luego saltaba a
        negro: un fogonazo blanco de varios segundos en móvil.

        Estas cuatro líneas leen exactamente lo mismo que ThemeContext
        (localStorage 'nova-theme', por omisión 'dark') y ponen la clase antes
        del primer pintado. Si cambias el valor por omisión allá, cámbialo aquí.
        -->
        <script>
          (function () {
            try {
              var t = localStorage.getItem('nova-theme');
              if (t !== 'light' && t !== 'dark' && t !== 'system') t = 'dark';

                && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

            } catch (e) { document.documentElement.classList.add('dark'); }
          })();
        </script>

          @media (min-width: 640px) {

          }
