name: Deploy website

# ⛔ NO se dispara solo. Orden de Christián del 2026-07-31.
#
# Este sitio se publica en CLOUDFLARE PAGES y SOLO con ./desplegar.sh, que es
# el único camino que verifica el bundle en vivo y sabe dar marcha atrás.
# Este workflow publica en OTRO lado (GitHub Pages) y antes corría en cada
# push a main: el 31 de julio se disparó cinco veces en veinticinco minutos,
# una por commit, sin que nadie lo pidiera. Eso es justo lo que la regla
# «los cambios se acumulan y salen JUNTOS» busca evitar.
#
# No lo borramos por si algún día hace falta un espejo, pero ya no se dispara
# solo: hay que ir a la pestaña Actions y correrlo a mano. Si lo vuelves a
# poner en `push`, acuérdate de que public/CNAME reclamaba exygenlabs.com,
# el dominio de producción. Ver memoria dos-sistemas-de-despliegue.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Build
        env:
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
        run: npm run build
      - name: Support direct page links
        run: cp build/index.html build/404.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
